<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Portal Login | PT Synodic</title>
    <style>
        :root {
            --synodic-blue: #2c3e50;
            --synodic-light: #34495e;
            --accent-blue: #3498db;
            --bg-gray: #f5f7fa;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, var(--synodic-blue) 0%, #1a252f 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-area { margin-bottom: 30px; }
        .logo-area h1 { 
            color: var(--synodic-blue); 
            margin: 0; 
            font-size: 24px; 
            letter-spacing: 1px;
        }
        .logo-area p { color: #7f8c8d; font-size: 14px; margin-top: 5px; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 8px; }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #edf2f7;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: #fdfdfd;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--synodic-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover { background: var(--accent-blue); }

        .client-info {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-area">
        <h1>SYNODIC <span style="font-weight: 300; color: var(--accent-blue);">SUPPORT</span></h1>
        <p>Internal Ticketing Management</p>
    </div>

    <form>
        <div class="form-group">
            <label>Internal Email</label>
            <input type="email" value="rossi@synodic.com" placeholder="email@synodic.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="••••••••">
        </div>

        <button type="submit" class="btn-login">Login to Portal</button>
    </form>

</div>

</body>
</html>
