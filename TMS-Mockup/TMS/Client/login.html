<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Support Portal - PT Synodic</title>
    <style>
        :root {
            --primary-color: #e31e24; /* Identitas Merah Astra */
            --secondary-color: #2c3e50; /* Identitas PT Synodic */
            --bg-color: #f4f7f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .logo-section {
            margin-bottom: 30px;
        }

        .client-name {
            font-size: 18px;
            font-weight: bold;
            color: var(--secondary-color);
            margin: 0;
        }

        .support-by {
            font-size: 12px;
            color: #95a5a6;
            margin-top: 5px;
            display: block;
        }

        .divider {
            height: 2px;
            width: 50px;
            background: var(--primary-color);
            margin: 15px auto;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(227, 30, 36, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #c4191f;
            box-shadow: 0 5px 15px rgba(227, 30, 36, 0.3);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-section">
        <p class="client-name">Astra Daihatsu Motor</p>
        <span class="support-by">Ticketing System by <b>PT Synodic</b></span>
        <div class="divider"></div>
    </div>

    <form action="dashboard.html">
        <div class="form-group">
            <label for="username">Email Perusahaan</label>
            <input type="email" id="username" value="rusdiono@astra.com" readonly>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password Anda" required>
        </div>

        <button type="submit" class="btn-login">Masuk ke Portal</button>
    </form>

    <div class="footer">
        &copy; 2026 PT Synodic IT Support Solutions
    </div>
</div>

</body>
</html>
