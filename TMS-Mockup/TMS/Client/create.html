<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Tiket Baru | Astra Daihatsu Motor</title>
    <style>
        :root {
            --astra-red: #e31e24;
            --synodic-blue: #2c3e50;
            --bg-light: #f4f7f6;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-light); padding: 40px; margin: 0; }
        
        .form-card { 
            max-width: 750px; 
            margin: auto; 
            background: white; 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        }

        h2 { color: var(--synodic-blue); margin-top: 0; border-bottom: 2px solid #f4f4f4; padding-bottom: 15px; font-size: 20px; }

        .info-row { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 25px; 
            background: #fdf2f2; 
            padding: 15px; 
            border-radius: 8px;
            border-left: 4px solid var(--astra-red);
        }
        .info-item { flex: 1; font-size: 13px; color: #444; }
        .info-item b { display: block; font-size: 15px; color: var(--synodic-blue); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full { grid-column: span 2; }
        
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; font-size: 14px; }
        
        select, input[type="text"], textarea { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; 
            box-sizing: border-box; font-size: 14px; background-color: #fff;
        }

        select:focus, input:focus, textarea:focus {
            outline: none; border-color: var(--astra-red); box-shadow: 0 0 0 3px rgba(227, 30, 36, 0.05);
        }

        .sla-box {
            grid-column: span 2;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .sla-item { font-size: 12px; color: #666; }
        .sla-item b { color: var(--synodic-blue); font-size: 14px; }

        .file-upload { 
            border: 2px dashed #ddd; padding: 20px; text-align: center; border-radius: 8px; 
            background: #fafafa; cursor: pointer; color: #7f8c8d; font-size: 13px;
        }

        .btn-group { display: flex; gap: 15px; margin-top: 10px; }
        .btn { padding: 14px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; flex: 1; font-size: 15px; }
        .btn-submit { background: var(--astra-red); color: white; transition: 0.3s; }
        .btn-submit:hover { background: #c4191f; }
        .btn-cancel { background: #eee; color: #666; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Registrasi Tiket Dukungan Teknis</h2>

    <div class="info-row">
        <div class="info-item">Sisa Kuota PM <b>02 Tiket</b></div>
        <div class="info-item">Sisa Kuota CM <b>18 Tiket</b></div>
        <div class="info-item">Client <b>Astra Daihatsu Motor</b></div>
    </div>

    <form>
        <div class="form-grid">
            <div class="form-group">
                <label>Jenis Maintenance</label>
                <select name="maintenance_type" required>
                    <option value="" disabled selected>Pilih Jenis...</option>
                    <option value="PM">Preventive Maintenance (PM)</option>
                    <option value="CM">Corrective Maintenance (CM)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Urgensi (Priority Level)</label>
                <select id="prioritySelect" name="priority" onchange="updateSLA()" required>
                    <option value="L3" selected>Level 3 - Medium (Normal)</option>
                    <option value="L1">Level 1 - Critical (System Down)</option>
                    <option value="L2">Level 2 - High (Major Error)</option>
                    <option value="L4">Level 4 - Low (Consultation)</option>
                </select>
            </div>

            <div class="sla-box">
                <div class="sla-item">Target Respon: <b id="respTime">4 Jam</b></div>
                <div style="width: 1px; height: 20px; background: #ddd;"></div>
                <div class="sla-item">Target Solusi: <b id="solvTime">24 Jam</b></div>
            </div>

            <div class="form-group">
                <label>Produk</label>
                <select id="productSelect" name="product_category" onchange="updateProjectOptions()" required>
                    <option value="" disabled selected>Pilih Produk...</option>
                    <option value="Appworks">Appworks</option>
                    <option value="ECM">ECM (Enterprise Content Mgmt)</option>
                    <option value="Intelligent Capture">Intelligent Capture</option>
                </select>
            </div>

            <div class="form-group">
                <label>Project</label>
                <select id="projectSelect" name="project" required disabled>
                    <option value="" disabled selected>Pilih Produk Terlebih Dahulu</option>
                </select>
            </div>

            <div class="form-group full">
                <label>Subjek Masalah</label>
                <input type="text" placeholder="Contoh: Error Login pada Intelligent Capture">
            </div>

            <div class="form-group full">
                <label>Deskripsi Detail</label>
                <textarea rows="4" placeholder="Jelaskan kendala yang dialami secara mendetail..."></textarea>
            </div>
        </div>

        <div class="form-group">
            <label>Lampiran Pendukung</label>
            <div class="file-upload">
                <input type="file" multiple id="fileInput" style="display:none">
                <span onclick="document.getElementById('fileInput').click()">
                    Klik untuk melampirkan screenshot atau log file (Max 5MB)
                </span>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-cancel">Batal</button>
            <button type="submit" class="btn btn-submit" onclick="window.location.href='dashboard.html';">Kirim Tiket & Gunakan Kuota</button>
        </div>
    </form>
</div>

<script>
    // Data Mapping Produk ke Project
    const dataMapping = {
        'Appworks': ['BPE', 'TORA', 'Export&Import'],
        'ECM': ['Export&Import', 'License Tracking'],
        'Intelligent Capture': ['Export&Import', 'Delvi']
    };

    function updateProjectOptions() {
        const productSelect = document.getElementById('productSelect');
        const projectSelect = document.getElementById('projectSelect');
        const selectedProduct = productSelect.value;

        // Reset Project Dropdown
        projectSelect.innerHTML = '<option value="" disabled selected>Pilih Project...</option>';
        
        if (selectedProduct && dataMapping[selectedProduct]) {
            projectSelect.disabled = false;
            dataMapping[selectedProduct].forEach(project => {
                const option = document.createElement('option');
                option.value = project;
                option.text = project;
                projectSelect.appendChild(option);
            });
        } else {
            projectSelect.disabled = true;
        }
    }

    function updateSLA() {
        const priority = document.getElementById('prioritySelect').value;
        const respTime = document.getElementById('respTime');
        const solvTime = document.getElementById('solvTime');
        
        const slaMap = {
            'L1': { resp: '30 Menit', solv: '4 Jam', color: '#e31e24' },
            'L2': { resp: '1 Jam', solv: '8 Jam', color: '#e67e22' },
            'L3': { resp: '4 Jam', solv: '24 Jam', color: '#2c3e50' },
            'L4': { resp: '24 Jam', solv: '3 Hari', color: '#7f8c8d' }
        };

        const config = slaMap[priority];
        respTime.innerText = config.resp;
        solvTime.innerText = config.solv;
        respTime.style.color = config.color;
    }
</script>

</body>
</html>
